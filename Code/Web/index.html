<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis 债优盾 | 中小债权人维权智能平台</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f172a%22/><text y=%2268%22 x=%2250%22 text-anchor=%22middle%22 font-size=%2250%22>🛡</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown-dark.css">

    <style>
        :root {
            --bg-dark: #0f172a;
            --accent: #38bdf8;
            --accent2: #818cf8;
            --glass: rgba(30, 41, 59, 0.85);
            --card: rgba(30, 41, 59, 0.6);
        }

        body {
            background-color: var(--bg-dark);
            color: #e2e8f0;
            background-image: radial-gradient(circle at 50% -10%, #1e3a5f, transparent 60%),
                radial-gradient(circle at 80% 60%, #1e1b4b, transparent 50%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        .view-section {
            animation: fadeSlide 0.35s ease-out;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            transition: all 0.2s ease;
        }

        .card:hover {
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(56, 189, 248, 0.1);
        }

        .card-main {
            border: 1px solid rgba(56, 189, 248, 0.3);
            background: rgba(14, 165, 233, 0.08);
        }

        .chat-container {
            height: calc(100vh - 210px);
            overflow-y: auto;
            padding-bottom: 100px;
            scroll-behavior: smooth;
        }

        .markdown-body {
            background: transparent !important;
            font-size: 15px !important;
            line-height: 1.85;
            color: #cbd5e1 !important;
        }

        .markdown-body h2 {
            color: var(--accent) !important;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2) !important;
            padding-bottom: 6px;
        }

        .markdown-body strong {
            color: #fbbf24;
            font-weight: 700;
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0;
            font-size: 13px;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            text-align: left;
        }

        .markdown-body th {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(34, 197, 94, 0);
            }
        }

        .score-ring {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            border: 4px solid;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(56, 189, 248, 0.3);
        }

        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .tag-legal {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
        }

        .tag-finance {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }
    </style>
</head>

<body class="min-h-screen">
    <!-- ==================== Navigation Bar ==================== -->
    <nav class="glass sticky top-0 z-50 px-6 py-3 mx-4 mt-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🛡️</span>
            <div>
                <h1 class="text-lg font-bold text-white">Aegis 债优盾</h1>
                <p class="text-xs text-slate-400">中小债权人维权智能平台</p>
            </div>
        </div>
        <div class="flex items-center gap-2" id="nav-buttons">
            <button onclick="switchView('landing')" id="nav-landing"
                class="px-3 py-1.5 text-sm rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition">首页</button>
            <button onclick="switchView('chat')" id="nav-chat"
                class="px-3 py-1.5 text-sm rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition">智能对话</button>
            <button onclick="switchView('doc')" id="nav-doc"
                class="px-3 py-1.5 text-sm rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition">文书导出</button>
            <button onclick="switchView('admin')" id="nav-admin"
                class="px-3 py-1.5 text-sm rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition">管理看板</button>
        </div>
    </nav>

    <!-- ==================== Landing: Scenario Selection ==================== -->
    <div id="view-landing" class="view-section max-w-5xl mx-auto px-6 pt-12 pb-20">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-white mb-3">选择您的维权场景</h2>
            <p class="text-slate-400 text-lg">系统将根据您的场景，提供针对性的证据分析、法律研判和行动指引</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="scenario-grid">
            <!-- Scenarios injected by JS -->
        </div>

        <div class="mt-8 text-center">
            <button onclick="quickStart()"
                class="btn-primary px-8 py-3 text-lg">
                直接开始咨询（AI 自动判断场景）
            </button>
        </div>
    </div>

    <!-- ==================== Chat View ==================== -->
    <div id="view-chat" class="view-section relative" style="display:none;">
        <!-- Scenario Badge -->
        <div class="max-w-4xl mx-auto px-6 pt-4 flex items-center gap-3 flex-wrap">
            <span id="chat-scenario-badge"
                class="tag tag-legal text-sm px-4 py-1.5">未选择场景</span>
            <button onclick="switchView('landing')"
                class="text-xs text-slate-400 hover:text-white underline">切换场景</button>
            <span class="text-xs text-slate-500 ml-auto" id="chat-model-indicator">DeepSeek-V4</span>
        </div>

        <!-- Chat Area -->
        <div class="max-w-4xl mx-auto px-6">
            <div class="chat-container glass p-6 mt-3" id="chat-messages">
                <div class="text-center text-slate-500 py-16" id="chat-empty">
                    <p class="text-5xl mb-4">🛡️</p>
                    <p class="text-lg font-semibold text-white mb-2">债优盾 AI 法律顾问已就绪</p>
                    <p class="text-sm">请描述您遇到的债务问题，或上传相关材料</p>
                    <p class="text-xs text-slate-600 mt-2">支持图片（OCR 识别）、PDF、Word、TXT</p>
                </div>
            </div>
        </div>

        <!-- Input Bar -->
        <div class="fixed bottom-0 left-0 right-0 z-40 pb-4 pt-2"
            style="background: linear-gradient(transparent, var(--bg-dark) 30%);">
            <div class="max-w-4xl mx-auto px-6">
                <div class="glass p-3 flex items-end gap-3">
                    <!-- File Upload -->
                    <label class="cursor-pointer p-2.5 rounded-lg hover:bg-white/5 transition text-slate-400 hover:text-white"
                        title="上传文件">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                        </svg>
                        <input type="file" id="file-input" accept="image/*,.pdf,.docx,.doc,.txt"
                            onchange="handleFileUpload(this)" class="hidden" multiple>
                    </label>

                    <!-- Voice Button (Fake - fills preset text) -->
                    <button onclick="fakeVoiceInput()"
                        class="p-2.5 rounded-lg hover:bg-white/5 transition text-slate-400 hover:text-white"
                        title="语音输入">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                        </svg>
                    </button>

                    <!-- Text Input -->
                    <textarea id="chat-input" rows="1"
                        class="flex-1 bg-transparent border-none outline-none resize-none text-white placeholder-slate-500 py-2 text-sm"
                        placeholder="描述您的债务问题..."
                        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"
                        oninput="autoResize(this)"></textarea>

                    <!-- Send Button -->
                    <button onclick="sendMessage()"
                        class="btn-primary px-5 py-2.5 flex-shrink-0 disabled:opacity-40" id="send-btn">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Evidence Panel (Right Sidebar on Desktop) -->
        <div id="evidence-panel"
            class="fixed right-4 top-24 w-72 glass p-4 hidden lg:block text-xs overflow-y-auto"
            style="max-height: calc(100vh - 140px);">
            <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                <span class="pulse-dot"></span> 案件画像
            </h3>
            <div id="evidence-content" class="space-y-2 text-slate-400">
                <p class="text-slate-500">发送第一条消息后自动生成</p>
            </div>
            <div class="mt-4 pt-3 border-t border-white/10" id="score-display">
                <p class="text-xs text-slate-500 mb-1">加速到期可行性</p>
                <div class="flex items-center gap-3">
                    <div class="score-ring border-slate-600 text-slate-500" id="score-ring">--</div>
                    <p class="text-xs text-slate-500">等待分析</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== Document Export View ==================== -->
    <div id="view-doc" class="view-section max-w-4xl mx-auto px-6 pt-8 pb-20" style="display:none;">
        <h2 class="text-2xl font-bold text-white mb-6">法律文书导出</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <button onclick="generateDoc('complaint')" class="card p-6 text-left">
                <h3 class="font-bold text-white mb-2">📝 民事起诉状</h3>
                <p class="text-sm text-slate-400">股东出资纠纷 / 债权人代位权纠纷</p>
            </button>
            <button onclick="generateDoc('support')" class="card p-6 text-left">
                <h3 class="font-bold text-white mb-2">📋 支持起诉申请书</h3>
                <p class="text-sm text-slate-400">向检察机关申请支持起诉</p>
            </button>
            <button onclick="generateDoc('evidence_list')" class="card p-6 text-left">
                <h3 class="font-bold text-white mb-2">📎 证据清单</h3>
                <p class="text-sm text-slate-400">整理并列出已有证据和缺失证据</p>
            </button>
            <button onclick="generateDoc('preservation')" class="card p-6 text-left">
                <h3 class="font-bold text-white mb-2">🔒 财产保全申请书</h3>
                <p class="text-sm text-slate-400">诉前/诉中财产保全申请</p>
            </button>
        </div>
        <div class="glass p-6" id="doc-preview">
            <p class="text-slate-500 text-center py-8">选择上方文书类型，自动生成预览</p>
        </div>
        <div class="mt-4 text-right">
            <button onclick="exportDocx()" class="btn-primary px-6 py-2.5" id="export-btn" disabled>
                导出 DOCX 文件
            </button>
        </div>
    </div>

    <!-- ==================== Admin Dashboard ==================== -->
    <div id="view-admin" class="view-section max-w-6xl mx-auto px-6 pt-8 pb-20" style="display:none;">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold text-white">管理看板</h2>
            <div class="flex items-center gap-2">
                <span class="pulse-dot"></span>
                <span class="text-xs text-slate-400">系统运行中</span>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8" id="admin-stats">
            <div class="card p-4 text-center">
                <p class="text-2xl font-bold text-white" id="stat-total">--</p>
                <p class="text-xs text-slate-400">总咨询次数</p>
            </div>
            <div class="card p-4 text-center">
                <p class="text-2xl font-bold text-green-400" id="stat-scored">--</p>
                <p class="text-xs text-slate-400">已完成评分</p>
            </div>
            <div class="card p-4 text-center">
                <p class="text-2xl font-bold text-amber-400" id="stat-files">--</p>
                <p class="text-xs text-slate-400">文件上传</p>
            </div>
            <div class="card p-4 text-center">
                <p class="text-2xl font-bold text-blue-400" id="stat-docs">--</p>
                <p class="text-xs text-slate-400">文书导出</p>
            </div>
        </div>

        <!-- Events Table -->
        <div class="glass p-4 overflow-x-auto">
            <h3 class="font-bold text-white mb-4">平台事件日志</h3>
            <table class="w-full text-sm">
                <thead>
                    <tr class="text-slate-400 text-left border-b border-white/10">
                        <th class="px-3 py-2">时间</th>
                        <th class="px-3 py-2">类型</th>
                        <th class="px-3 py-2">场景</th>
                        <th class="px-3 py-2">摘要</th>
                    </tr>
                </thead>
                <tbody id="admin-events" class="text-slate-300"></tbody>
            </table>
            <div class="mt-4 flex gap-4">
                <button onclick="refreshAdmin()" class="text-xs text-slate-400 hover:text-white underline">刷新</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== Configuration ====================
        const API_BASE = (() => {
            const params = new URLSearchParams(window.location.search);
            const apiParam = params.get('api');
            if (apiParam) return apiParam;
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return `http://127.0.0.1:8000`;
            }
            if (window.AEGIS_CONFIG && window.AEGIS_CONFIG.publicApiBase) {
                return window.AEGIS_CONFIG.publicApiBase;
            }
            return window.location.origin;
        })();

        const SCENARIOS = {
            "1": { title: "公司欠钱不还，想追未实缴股东", desc: "公司作为债务人无法清偿到期债务，追究未足额缴纳出资的股东责任", icon: "🏛️",
                main: true },
            "2": { title: "公司不能清偿，判断能否主张出资加速到期", desc: "公司已具备破产原因但不申请破产，主张股东出资期限加速到期", icon: "⚖️", main: true },
            "3": { title: "债务发生后，公司延长了股东出资期限", desc: "公司对债权人负有债务后，通过决议延长股东出资期限逃避债务", icon: "📅" },
            "4": { title: "怀疑股东出资后又把钱转走", desc: "股东验资后通过虚构交易等方式将出资款项转出（抽逃出资）", icon: "💸" },
            "5": { title: "公司减资后导致债权无法清偿", desc: "公司未依法通知债权人即减资，损害债权人利益", icon: "📉" },
            "6": { title: "股东转让股权后无人履行出资义务", desc: "未届出资期限的股东转让股权给无履行能力的主体", icon: "🔄" },
            "7": { title: "不确定属于哪种情况", desc: "系统将引导梳理案情，自动匹配最合适的维权路径", icon: "🤔" },
        };

        let currentScenario = "unknown";
        let chatHistory = [];
        let currentSources = [];
        let docHtmlContent = "";

        // ==================== View Switching ====================
        function switchView(view) {
            const ids = ['view-landing', 'view-chat', 'view-doc', 'view-admin'];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });

            const viewMap = {
                'landing': 'view-landing',
                'chat': 'view-chat',
                'doc': 'view-doc',
                'admin': 'view-admin',
            };

            const target = viewMap[view] || 'view-landing';
            const el = document.getElementById(target);
            if (el) el.style.display = 'block';
            window.scrollTo(0, 0);

            // Update nav
            document.querySelectorAll('#nav-buttons button').forEach(b => {
                b.classList.remove('text-white', 'bg-white/10');
            });
            const navBtn = document.getElementById(`nav-${view}`);
            if (navBtn) navBtn.classList.add('text-white', 'bg-white/10');

            if (view === 'landing') renderScenarios();
            if (view === 'admin') refreshAdmin();
        }

        // ==================== Scenario Cards ====================
        function renderScenarios() {
            const grid = document.getElementById('scenario-grid');
            if (!grid) return;

            grid.innerHTML = Object.entries(SCENARIOS).map(([id, s]) => `
                <div class="card ${s.main ? 'card-main' : ''} p-5 cursor-pointer" onclick="selectScenario('${id}')">
                    <div class="flex items-start gap-4">
                        <span class="text-3xl">${s.icon}</span>
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <h3 class="font-bold text-white text-sm">${s.title}</h3>
                                ${s.main ? '<span class="tag tag-legal text-xs">主线</span>' : ''}
                            </div>
                            <p class="text-xs text-slate-400">${s.desc}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function selectScenario(scenarioId) {
            currentScenario = scenarioId;
            const s = SCENARIOS[scenarioId];
            updateScenarioBadge(scenarioId);
            switchView('chat');

            // Add system context message
            const chatEl = document.getElementById('chat-messages');
            const emptyEl = document.getElementById('chat-empty');
            if (emptyEl) emptyEl.style.display = 'none';

            const div = document.createElement('div');
            div.className = 'mb-4 text-center';
            div.innerHTML =
                `<span class="tag tag-legal text-sm px-4 py-1.5">已选择：${s.icon} ${s.title}</span>`;
            chatEl.appendChild(div);

            // Auto-send a starter query
            const starters = {
                "1": "我想追讨公司欠我的债务，但公司说没钱，我想追究未实缴股东的责任",
                "2": "请帮我判断我的情况能不能主张股东出资加速到期",
                "3": "债务发生后，公司延长了股东的出资期限，我该怎么办",
                "4": "我怀疑公司股东出资后又把钱转走了，怎么证明",
                "5": "公司减资后我的债权无法清偿，请问有什么办法",
                "6": "股东把股权转让给了一个没钱的人，我还能追他吗",
                "7": "我不确定我的情况属于哪种类型，请帮我初步判断一下",
            };

            setTimeout(() => {
                document.getElementById('chat-input').value = starters[scenarioId] || "";
                sendMessage();
            }, 300);
        }

        function quickStart() {
            currentScenario = "7";
            updateScenarioBadge("7");
            switchView('chat');
            setTimeout(() => {
                document.getElementById('chat-input').value = "请帮我分析我的债权情况";
                sendMessage();
            }, 300);
        }

        function updateScenarioBadge(scenarioId) {
            const badge = document.getElementById('chat-scenario-badge');
            if (!badge) return;
            const s = SCENARIOS[scenarioId];
            if (s) {
                badge.textContent = `${s.icon} 场景${scenarioId}：${s.title}`;
                badge.className = s.main ? 'tag tag-legal text-sm px-4 py-1.5' :
                    'tag tag-finance text-sm px-4 py-1.5';
            } else {
                badge.textContent = '通用法律咨询';
            }
        }

        // ==================== Voice Input (Fake) ====================
        function fakeVoiceInput() {
            const input = document.getElementById('chat-input');
            const presets = [
                "我有一笔债务，公司说没钱还，股东也没有实缴完出资，我该怎么追讨？",
                "请你帮我分析一下，我的情况能不能要求股东出资加速到期？",
                "我有公司的工商信息，想让你帮我看看股东出资情况是否正常。",
                "债务人公司正在减资，我的债权会不会受影响？",
            ];
            const preset = presets[Math.floor(Math.random() * presets.length)];
            input.value = preset;
            input.style.height = 'auto';
            input.style.height = input.scrollHeight + 'px';
            input.focus();

            // Brief highlight animation
            input.style.transition = 'all 0.15s';
            input.style.borderColor = '#38bdf8';
            setTimeout(() => { input.style.borderColor = ''; }, 500);
        }

        // ==================== Chat ====================
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const query = input.value.trim();
            if (!query) return;

            const emptyEl = document.getElementById('chat-empty');
            if (emptyEl) emptyEl.style.display = 'none';

            // Render user message
            appendMessage('user', query);
            input.value = '';
            input.style.height = 'auto';
            chatHistory.push({ role: "user", content: query });

            // Render AI placeholder
            const aiDiv = appendMessage('ai', '');
            const contentDiv = aiDiv.querySelector('.ai-content');
            const reasoningDiv = aiDiv.querySelector('.ai-reasoning');

            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        stream: true,
                        history: chatHistory.slice(0, -1),
                        scenario: currentScenario,
                        user_name: "债权人",
                    }),
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let fullContent = '';
                let fullReasoning = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const jsonStr = line.slice(6);
                        if (jsonStr === '[DONE]') continue;

                        try {
                            const data = JSON.parse(jsonStr);
                            if (data.type === 'meta') {
                                if (data.sources) currentSources = data.sources;
                                updateEvidencePanel(data);
                            } else if (data.type === 'reasoning') {
                                fullReasoning += data.content;
                                if (reasoningDiv) reasoningDiv.innerHTML = marked.parse(
                                    '<details><summary>思考过程</summary>' + data.content + '</details>');
                            } else if (data.type === 'chunk') {
                                fullContent += data.content;
                                if (contentDiv) contentDiv.innerHTML = marked.parse(fullContent);
                                scrollChat();
                                updateScoreFromContent(fullContent);
                            }
                        } catch (e) { /* skip partial JSON */ }
                    }
                }

                chatHistory.push({ role: "assistant", content: fullContent });

            } catch (e) {
                if (contentDiv) contentDiv.innerHTML =
                    `<p class="text-red-400">网络错误：${e.message}。请检查后端是否运行在 ${API_BASE}</p>`;
            }

            sendBtn.disabled = false;
            scrollChat();
        }

        function appendMessage(role, text) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'mb-5';

            if (role === 'user') {
                div.innerHTML = `
                    <div class="flex justify-end">
                        <div class="max-w-[85%] glass px-4 py-2.5 rounded-2xl rounded-br-md">
                            <p class="text-sm text-white whitespace-pre-wrap">${escapeHtml(text)}</p>
                        </div>
                    </div>`;
            } else {
                div.innerHTML = `
                    <div class="flex gap-3">
                        <span class="text-xl flex-shrink-0 mt-1">🛡️</span>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs text-slate-500 mb-1">Justitia · AI 法律顾问</p>
                            <div class="ai-reasoning text-xs text-slate-500"></div>
                            <div class="ai-content markdown-body"></div>
                        </div>
                    </div>`;
                if (text) {
                    const contentDiv = div.querySelector('.ai-content');
                    if (contentDiv) contentDiv.innerHTML = marked.parse(text);
                }
            }

            container.appendChild(div);
            scrollChat();
            return div;
        }

        function scrollChat() {
            const container = document.getElementById('chat-messages');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        }

        // ==================== Evidence Panel ====================
        function updateEvidencePanel(meta) {
            const panel = document.getElementById('evidence-content');
            if (!panel) return;

            let html = '';
            if (meta.sources && meta.sources.length > 0) {
                html += '<p class="text-white font-semibold mb-1">法律参考：</p>';
                meta.sources.slice(0, 3).forEach(s => {
                    html +=
                        `<p class="text-xs mb-1"><span class="tag tag-legal">${escapeHtml(s.filename)}</span></p>`;
                });
            }
            if (meta.finance && meta.finance.sql) {
                html += '<p class="text-white font-semibold mt-3 mb-1">财务查询：</p>';
                html +=
                    `<p class="text-xs font-mono text-green-400 break-all">${escapeHtml(meta.finance.sql.substring(0, 100))}</p>`;
            }
            if (!html) html = '<p class="text-slate-500">等待更多信息...</p>';
            panel.innerHTML = html;
        }

        function updateScoreFromContent(content) {
            const scoreMatch = content.match(/可行性评分[：:]\s*(\d{1,3})\s*分?/);
            if (scoreMatch) {
                const score = parseInt(scoreMatch[1]);
                updateScoreRing(score);
            }
        }

        function updateScoreRing(score) {
            const ring = document.getElementById('score-ring');
            if (!ring) return;
            ring.textContent = score;
            ring.style.borderColor = score >= 70 ? '#22c55e' : score >= 40 ? '#f59e0b' : '#ef4444';
            ring.style.color = score >= 70 ? '#22c55e' : score >= 40 ? '#f59e0b' : '#ef4444';
        }

        // ==================== File Upload ====================
        async function handleFileUpload(input) {
            const files = input.files;
            if (!files.length) return;

            const emptyEl = document.getElementById('chat-empty');
            if (emptyEl) emptyEl.style.display = 'none';

            for (const file of files) {
                appendMessage('user', `📎 上传文件：${file.name}`);

                const formData = new FormData();
                formData.append('file', file);

                try {
                    const resp = await fetch(`${API_BASE}/api/upload`, {
                        method: 'POST',
                        body: formData,
                    });
                    const data = await resp.json();

                    if (data.text) {
                        const preview = data.text.length > 500 ? data.text.substring(0, 500) + '...' : data.text;
                        const aiDiv = appendMessage('ai', '');
                        const contentDiv = aiDiv.querySelector('.ai-content');
                        if (contentDiv) contentDiv.innerHTML = marked.parse(
                            `**文件识别结果** (${data.engine || 'OCR'})\n\n\`\`\`\n${preview}\n\`\`\`\n\n已自动提取以上文本。您可以基于这些内容向我提问。`
                        );

                        chatHistory.push({ role: "user", content: `[上传文件: ${file.name}]` });
                        chatHistory.push({
                            role: "assistant",
                            content: `文件识别结果：\n${data.text}`
                        });

                        // Auto-send OCR text for analysis
                        if (data.text.length > 20) {
                            document.getElementById('chat-input').value =
                                `基于以上文件内容，请帮我分析维权路径`;
                            sendMessage();
                        }
                    }
                } catch (e) {
                    appendMessage('ai', `文件上传失败：${e.message}`);
                }
            }

            input.value = '';
        }

        async function exportDocx() {

                const a = document.createElement('a');

                URL.revokeObjectURL(url);

        // ==================== Admin ====================
        async function refreshAdmin() {

                const resp = await fetch(`${API_BASE}/api/admin/events?password=admin888`);

                const events = data.events || [];

                document.getElementById('stat-total').textContent = data.total || events.length;
                document.getElementById('stat-scored').textContent = events.filter(e => e.type === 'chat')
                    .length;
                document.getElementById('stat-files').textContent = events.filter(e => e.type === 'file_upload')
                    .length;
                document.getElementById('stat-docs').textContent = events.filter(e => e.type === 'doc_export')
                    .length;

                const tbody = document.getElementById('admin-events');
                if (tbody) {
                    tbody.innerHTML = events.slice(-20).reverse().map(e => `

                            <td class="px-3 py-2 text-xs text-slate-500">${(e.timestamp || '').substring(11, 19)}</td>
